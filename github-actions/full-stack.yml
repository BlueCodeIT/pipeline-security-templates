name: Full Security Stack

# Reusable workflow — runs Trivy, Semgrep, and Checkov in parallel.
# All findings land in GitHub's Security tab.
#
# Usage in your repo:
#
# jobs:
#   security:
#     uses: BlueCodeIT/pipeline-security-templates/.github/workflows/full-stack.yml@main
#

on:
  workflow_call:
    inputs:
      # Shared
      fail-on-issues:
        description: 'Fail the build when any tool reports findings'
        required: false
        type: boolean
        default: true

      # Trivy
      trivy-image:
        description: 'Container image to scan. Empty = build from Dockerfile'
        required: false
        type: string
        default: ''
      trivy-dockerfile:
        description: 'Path to Dockerfile (only used if trivy-image is empty)'
        required: false
        type: string
        default: 'Dockerfile'
      trivy-severity:
        description: 'Trivy severity threshold'
        required: false
        type: string
        default: 'CRITICAL,HIGH'

      # Semgrep
      semgrep-config:
        description: 'Semgrep ruleset (e.g. p/default, p/security-audit, auto)'
        required: false
        type: string
        default: 'p/default'
      semgrep-severity:
        description: 'Semgrep severity threshold'
        required: false
        type: string
        default: 'WARNING'
      semgrep-paths-exclude:
        description: 'Paths to exclude from Semgrep (newline-separated)'
        required: false
        type: string
        default: ''

      # Checkov
      checkov-directory:
        description: 'Directory for Checkov to scan'
        required: false
        type: string
        default: '.'
      checkov-framework:
        description: 'Frameworks for Checkov (e.g. all, terraform, kubernetes)'
        required: false
        type: string
        default: 'all'
      checkov-skip-checks:
        description: 'Comma-separated Checkov check IDs to skip'
        required: false
        type: string
        default: ''

      # Selectively disable tools
      skip-trivy:
        description: 'Skip Trivy scan (useful when no Docker context)'
        required: false
        type: boolean
        default: false
      skip-semgrep:
        description: 'Skip Semgrep scan'
        required: false
        type: boolean
        default: false
      skip-checkov:
        description: 'Skip Checkov scan (useful when no IaC files)'
        required: false
        type: boolean
        default: false

jobs:
  trivy:
    if: inputs.skip-trivy == false
    uses: ./.github/workflows/trivy-container-scan.yml
    with:
      image: ${{ inputs.trivy-image }}
      dockerfile: ${{ inputs.trivy-dockerfile }}
      severity: ${{ inputs.trivy-severity }}
      fail-on-issues: ${{ inputs.fail-on-issues }}

  semgrep:
    if: inputs.skip-semgrep == false
    uses: ./.github/workflows/semgrep-sast.yml
    with:
      config: ${{ inputs.semgrep-config }}
      severity: ${{ inputs.semgrep-severity }}
      fail-on-issues: ${{ inputs.fail-on-issues }}
      paths-exclude: ${{ inputs.semgrep-paths-exclude }}

  checkov:
    if: inputs.skip-checkov == false
    uses: ./.github/workflows/checkov-iac.yml
    with:
      directory: ${{ inputs.checkov-directory }}
      framework: ${{ inputs.checkov-framework }}
      soft-fail: ${{ !inputs.fail-on-issues }}
      skip-checks: ${{ inputs.checkov-skip-checks }}

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trivy, semgrep, checkov]
    if: always()
    steps:
      - name: Aggregate results
        run: |
          echo "## 🔒 Security Stack Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Container CVEs) | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep (SAST) | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov (IaC) | ${{ needs.checkov.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed findings: see **Security tab** of this repository." >> $GITHUB_STEP_SUMMARY
name: Trivy Container Scan

# Reusable workflow — call from your repo with `uses:`
# See: https://docs.github.com/en/actions/using-workflows/reusing-workflows

on:
  workflow_call:
    inputs:
      image:
        description: 'Container image to scan. Leave empty to build from Dockerfile in repo root.'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to Dockerfile (only used if image is empty)'
        required: false
        type: string
        default: 'Dockerfile'
      severity:
        description: 'Comma-separated severity levels: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      fail-on-issues:
        description: 'Fail the build when vulnerabilities are found'
        required: false
        type: boolean
        default: true
      ignore-unfixed:
        description: 'Ignore vulnerabilities without an available fix'
        required: false
        type: boolean
        default: true

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Required to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (if no image provided)
        if: inputs.image == ''
        run: docker build -t scan-target:latest -f ${{ inputs.dockerfile }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image == '' && 'scan-target:latest' || inputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          exit-code: ${{ inputs.fail-on-issues && '1' || '0' }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container

      - name: Run Trivy (table output for logs)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image == '' && 'scan-target:latest' || inputs.image }}
          format: 'table'
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          exit-code: '0'
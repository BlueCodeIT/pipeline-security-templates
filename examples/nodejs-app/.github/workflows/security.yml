name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Option 1 — Single tool (uncomment to use)
  #
  # trivy:
  #   uses: BlueCodeIT/pipeline-security-templates/.github/workflows/trivy-container-scan.yml@main
  #   with:
  #     dockerfile: examples/nodejs-app/Dockerfile

  # Option 2 — Full stack (Trivy + Semgrep + Checkov in parallel)
  security:
    uses: BlueCodeIT/pipeline-security-templates/.github/workflows/full-stack.yml@main
    with:
      trivy-dockerfile: examples/nodejs-app/Dockerfile
      semgrep-paths-exclude: |
        node_modules/
      checkov-directory: examples/nodejs-app/k8s
      fail-on-issues: false   # Demo intentionally has findings — don't break the pipeline

  # Option 3 — Full stack + Deployment Guard (requires GUARD_API_KEY secret)
  #
  # security-with-guard:
  #   uses: BlueCodeIT/pipeline-security-templates/.github/workflows/full-stack-with-guard.yml@main
  #   with:
  #     trivy-dockerfile: examples/nodejs-app/Dockerfile
  #     fail-on-issues: false
  #   secrets:
  #     guard-api-key: ${{ secrets.GUARD_API_KEY }}
name: Semgrep SAST Scan

on:
  workflow_call:
    inputs:
      config:
        description: 'Semgrep ruleset. Common: p/default, p/security-audit, p/ci, p/owasp-top-ten, or auto'
        required: false
        type: string
        default: 'p/default'
      severity:
        description: 'Minimum severity to report: ERROR, WARNING, INFO'
        required: false
        type: string
        default: 'WARNING'
      fail-on-issues:
        description: 'Fail the build when findings match severity threshold'
        required: false
        type: boolean
        default: true
      paths-include:
        description: 'Paths to include (newline-separated). Default: scan everything.'
        required: false
        type: string
        default: ''
      paths-exclude:
        description: 'Paths to exclude (newline-separated). E.g. test/ or vendor/'
        required: false
        type: string
        default: ''

jobs:
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.92.0
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        id: scan
        env:
          SEMGREP_RULES: ${{ inputs.config }}
        run: |
          set +e

          # Build argument list as array (cleaner than string concat)
          ARGS=("--sarif" "--output=semgrep-results.sarif" "--severity=${{ inputs.severity }}")

          # Optional path filters
          if [ -n "${{ inputs.paths-include }}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              ARGS+=("--include=$line")
            done <<< "${{ inputs.paths-include }}"
          fi

          if [ -n "${{ inputs.paths-exclude }}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              ARGS+=("--exclude=$line")
            done <<< "${{ inputs.paths-exclude }}"
          fi

          # Run scan WITHOUT --error to ensure SARIF is always written
          # We control fail behavior at the end based on inputs.fail-on-issues
          semgrep scan "${ARGS[@]}"
          SCAN_EXIT=$?

          # Verify SARIF was written, create empty if missing
          if [ ! -f semgrep-results.sarif ]; then
            echo "Warning: SARIF file not generated, creating empty placeholder"
            echo '{"version":"2.1.0","runs":[]}' > semgrep-results.sarif
          fi

          echo "scan_exit=$SCAN_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep-results.sarif'
          category: semgrep

      - name: Run Semgrep again (table output for logs)
        if: always()
        env:
          SEMGREP_RULES: ${{ inputs.config }}
        run: |
          semgrep scan --severity=${{ inputs.severity }} || true

      - name: Fail build if requested
        if: inputs.fail-on-issues && steps.scan.outputs.scan_exit != '0'
        run: |
          echo "Semgrep found issues at severity ${{ inputs.severity }} or higher."
          exit 1